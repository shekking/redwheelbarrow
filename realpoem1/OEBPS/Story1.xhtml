<p class="p1"><span class="span1">Fog</span></p>
<p class="p2"><span class="span2">by Carl Sandburg</span></p>
<p class="p3"></p>
<p class="p4"><span class="span3">The fog comes</span></p>
<p class="p4"><span class="span3">on little cat feet.</span></p>
<p class="p4"><span class="span3">It sits looking</span></p>
<p class="p4"><span class="span3">over harbor and city</span></p>
<p class="p4"><span class="span3">on silent haunches</span></p>
<p class="p4"><span class="span3">and then moves on.</span></p>
<p class="p1"><span class="span2">First published in Chicago Poems, Henry Holt and Company, 1916. Public Domain.</span></p>
